  run-jvm-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: ["build-jni-linux"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'oracle'
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ndk_version }}
          key: ndk-${{ runner.os }}-${{ env.ndk_version }}

      - name: Setup Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;${{ env.ndk_version }}"

      - name: Cache Docker images
        id: docker-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/docker-cache
          key: docker-${{ runner.os }}-${{ hashFiles('tests/compose.yaml') }}

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-cache/images.tar

      - name: Start backend services
        run: |
          cd tests
          docker compose up -d
          sleep 15
          cd ..

      - name: Save Docker images to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          docker save simplito/janus-gateway-docker:v1.4.0 coturn/coturn mongo:7.0 -o /tmp/docker-cache/images.tar

      - name: Prepare properties configuration
        run: |
          cat > local.properties <<EOF
          sdk.dir=${{ env.ANDROID_SDK_ROOT }}
          ndk.version=${{ env.ndk_version }}
          EOF

      - name: Prepare env to tests
        run: ./gradlew :privmx-endpoint:testsPreConfig

      - name: Prepare keys
        run: |
          ./gradlew :privmx-endpoint:GeneratePemKey
          ./gradlew :privmx-endpoint:GeneratePGPKey

      - name: Download linux JNI artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-jni-${{ github.sha }}
          path: privmx-endpoint/jniTestLibs/Linux/

      - name: Copy linux libs to correct dir
        run: |
          cp -r privmx-endpoint/jniTestLibs/Linux/*/* privmx-endpoint/jniTestLibs/Linux/

      - name: Run PrivMX Endpoint Java Tests without Events
        run: ./gradlew :privmx-endpoint:cleanJvmTest :privmx-endpoint:jvmTest -PexcludeTests="*EventsTest*"

      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-test-results-${{ github.sha }}
          path: privmx-endpoint/build/reports/tests/jvmTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run PrivMX Endpoint Java Events Tests
        if: always()
        run: ./gradlew :privmx-endpoint:cleanJvmTest :privmx-endpoint:jvmTest --tests "EventsTest"

      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-events-test-results-${{ github.sha }}
          path: privmx-endpoint/build/reports/tests/jvmTest/
          if-no-files-found: ignore
          retention-days: 14

