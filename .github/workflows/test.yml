name: Tests

on:
  push:
    branches: ["**"]
  workflow_run:
    workflows: ["Native Builds"]
    branches: ["main","dev","release/*","**"]
    types: ["completed"]
  workflow_dispatch:

env:
  ndk_version: 29.0.13599879

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    timeout-minutes: 30
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'oracle'
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ndk_version }}
          key: ndk-${{ runner.os }}-${{ env.ndk_version }}

      - name: Setup Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;${{ env.ndk_version }}"

      - name: Cache Homebrew packages
        id: brew-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/colima
            /usr/local/Cellar/docker
            /usr/local/Cellar/docker-compose
            /usr/local/Cellar/qemu
          key: brew-${{ runner.os }}-colima-docker-docker-compose-qemu

      - name: Install Colima + Docker
        run: |
          brew install colima docker docker-compose qemu
          colima start --vm-type=vz --cpu 4 --memory 8

      - name: Cache Docker images
        id: docker-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/docker-cache
          key: docker-${{ runner.os }}-${{ hashFiles('tests/compose.yaml') }}

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-cache/images.tar

      - name: Start backend services
        run: |
          cd tests
          docker compose up -d
          sleep 15
          cd ..

      - name: Save Docker images to cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/docker-cache
          docker save simplito/janus-gateway-docker:v1.4.0 coturn/coturn mongo:7.0 -o /tmp/docker-cache/images.tar

      - name: Prepare properties configuration
        run: |
          cat > local.properties <<EOF
          sdk.dir=${{ env.ANDROID_SDK_ROOT }}
          ndk.version=${{ env.ndk_version }}
          EOF

      - name: Prepare env to tests
        run: ./gradlew :privmx-endpoint:testsPreConfig

      - name: Prepare keys
        run: |
          ./gradlew :privmx-endpoint:GeneratePemKey
          ./gradlew :privmx-endpoint:GeneratePGPKey

      - name: Download darwin JNI artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: darwin-jni-${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: privmx-endpoint/jniTestLibs/Darwin/arm64/

      - name: Run PrivMX Endpoint Java Tests
        run: ./gradlew :privmx-endpoint:jvmTest

