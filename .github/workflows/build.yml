name: Builds

on:
  pull_request:
    branches: [main, dev, 'release/*']
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ndk_version: 29.0.13599879

jobs:
  build-jni-android:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 21
          distribution: 'oracle'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ndk_version }}
          key: ndk-${{ runner.os }}-${{ env.ndk_version }}

      - name: Setup Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;${{ env.ndk_version }}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install Conan
        run: |
          pipx install conan
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Conan packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-android-${{ hashFiles('**/conanfile.*', '**/conan.lock') }}
          restore-keys: |
            conan-${{ runner.os }}-android-

      - name: Setup Conan
        run: |
          conan profile detect --force
          conan remote add privmx https://libs.simplito.com/artifactory/api/conan/privmx --force

      - name: Prepare properties configuration
        run: |
          cat > local.properties <<EOF
          sdk.dir=${{ env.ANDROID_SDK_ROOT }}
          ndk.version=${{ env.ndk_version }}
          EOF

      - name: Compile Android JNI
        run: ./gradlew :jni-wrapper:compileAndroid

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-jni-${{ github.sha }}
          path: jni-wrapper/build/native/install/Android/*
          if-no-files-found: error
          retention-days: 14


  build-jni-darwin:
    timeout-minutes: 15
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'oracle'
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ndk_version }}
          key: ndk-${{ runner.os }}-${{ env.ndk_version }}

      - name: Setup Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;${{ env.ndk_version }}"

      - name: Configure PrivMX conan repository and build tools
        run: |
          brew install pipx
          pipx install conan
          echo "~/.local/bin" >> $GITHUB_PATH

      - name: Cache Conan packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-darwin-${{ hashFiles('**/conanfile.*', '**/conan.lock') }}
          restore-keys: |
            conan-${{ runner.os }}-darwin-

      - name: Setup conan
        run: |
          conan profile detect --force
          conan remote add privmx https://libs.simplito.com/artifactory/api/conan/privmx --force

      - name: Prepare properties configuration
        run: |
          cat > local.properties <<EOF
          sdk.dir=${{ env.ANDROID_SDK_ROOT }}
          ndk.version=${{ env.ndk_version }}
          EOF

      - name: Compile android jni with conan dependencies
        run: ./gradlew :jni-wrapper:compileDarwin

      - uses: actions/upload-artifact@v7
        with:
          name: 'darwin-jni-${{github.sha}}'
          path: '${{github.workspace}}/jni-wrapper/build/native/install/Darwin/*'


  build-ios:
    timeout-minutes: 15
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'oracle'
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ndk_version }}
          key: ndk-${{ runner.os }}-${{ env.ndk_version }}

      - name: Setup Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;${{ env.ndk_version }}"

      - name: Configure PrivMX conan repository and build tools
        run: |
          brew install pipx
          pipx install conan
          echo "~/.local/bin" >> $GITHUB_PATH

      - name: Cache Conan packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-ios-${{ hashFiles('**/conanfile.*', '**/conan.lock') }}
          restore-keys: |
            conan-${{ runner.os }}-ios-

      - name: Setup conan
        run: |
          conan profile detect --force
          conan remote add privmx https://libs.simplito.com/artifactory/api/conan/privmx --force

      - name: Prepare properties configuration
        run: |
          cat > local.properties <<EOF
          sdk.dir=${{ env.ANDROID_SDK_ROOT }}
          ndk.version=${{ env.ndk_version }}
          EOF

      - name: Compile iOS endpoint
        run: ./gradlew :jni-wrapper:buildIosWithConan

      - name: Compile iOSSimulator endpoint
        run: ./gradlew :jni-wrapper:buildIosSimulatorWithConan

      - uses: actions/upload-artifact@v7
        with:
          name: 'ios-${{github.sha}}'
          path: '${{github.workspace}}/jni-wrapper/build/native/install/iOS/*'

      - uses: actions/upload-artifact@v7
        with:
          name: 'ios-simulator-${{github.sha}}'
          path: '${{github.workspace}}/jni-wrapper/build/native/install/iOSSimulator/*'