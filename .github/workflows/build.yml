name: Builds
on:
  pull_request:
    branches:
      - main
      - dev
      - release/*
    tags:
      - '**'
  push:
    branches:
      - main
      - dev
      - release/*
      - '**'


jobs:
  build-jni-android:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'oracle'
          cache: "maven"

      - name: Configure PrivMX conan repository and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pipx
          sudo pipx install conan
          echo "/root/.local/bin" >> $GITHUB_PATH

      - name: Setup conan
        run: |
          conan profile detect --force
          conan remote add privmx https://libs.simplito.com/artifactory/api/conan/privmx

      - name: Compile android jni with conan dependencies
        run: ./gradlew :jni-wrapper:compileAndroid

      - uses: actions/upload-artifact@v7
        with:
          name: 'android-jni-${{github.sha}}'
          path: '${{github.workspace}}/jni-wrapper/build/native/install/Android/*'

  build-jni-darwin:
    timeout-minutes: 15
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'oracle'
          cache: "maven"

      - name: Configure PrivMX conan repository and build tools
        run: |
          pip3 install --upgrade pipx
          pipx install conan
          echo "~/.local/bin" >> $GITHUB_PATH

      - name: Setup conan
        run: |
          conan profile detect --force
          conan remote add privmx https://libs.simplito.com/artifactory/api/conan/privmx

      - name: Compile android jni with conan dependencies
        run: ./gradlew :jni-wrapper:compileDarwin

      - uses: actions/upload-artifact@v7
        with:
          name: 'darwin-jni-${{github.sha}}'
          path: '${{github.workspace}}/jni-wrapper/build/native/install/Darwin/*'