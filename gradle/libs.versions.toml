[versions]
publishPrivmxEndpoint = "2.7.0"
kotlinxIoCore = "0.7.0"
kotlin-serialization = "2.1.20"
serialization-json = "1.8.1"
kotlin = "2.3.10"
agp = "8.12.0"
coroutines = "1.10.2"
webrtc-android = "1.0.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIoCore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
privmx-endpoint-webrtc-android = {group="com.simplito.webrtc", name="webrtc-android", version.ref= "webrtc-android"}

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-serialization" }
android-library = { id = "com.android.library", version.ref = "agp" }